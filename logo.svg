<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Lightning bolt icon -->
  <g transform="translate(5,5)">
    <polygon points="18,0 4,22 14,22 12,40 28,16 18,16 20,0" fill="url(#bolt-grad)" stroke="none"/>
  </g>
  <!-- Text -->
  <text x="50" y="34" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="800" fill="#f1f5f9" letter-spacing="0.5">Blue</text>
  <text x="110" y="34" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="800" fill="url(#bolt-grad)" letter-spacing="0.5">Lightning</text>
</svg>
