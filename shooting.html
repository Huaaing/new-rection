<style>

<body>

<div class="main-container">
  <div class="game-area">
    <a href="index.html" class="nav-btn">⚡ 反应力测试</a>
    <h1>🎯 射击训练</h1>

    <div class="stats-bar">
      <div>难度: <span id="diffLabel">入门</span></div>
      <div>命中: <span id="score">0</span></div>
      <div>时间: <span id="timer">30</span>s</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="canvas" width="600" height="450"></canvas>
      <div class="overlay" id="overlayStart">
        <div class="overlay-title">射击训练</div>
        <div class="overlay-sub">点击移动的小球来得分<br>30秒内尽可能多地命中目标</div>
        <div class="difficulty-selector" id="diffSelector">
          <button class="diff-btn active" data-diff="easy">入门</button>
          <button class="diff-btn" data-diff="medium">中等</button>
          <button class="diff-btn" data-diff="hard">困难</button>
        </div>
        <button class="btn btn-start" id="btnStart">开始游戏</button>
      </div>
      <div class="overlay hidden" id="overlayEnd">
        <div class="overlay-label" id="endDiffLabel">入门</div>
        <div class="overlay-score" id="finalScore">0</div>
        <div class="overlay-label" id="gradeLabel"></div>
        <div class="difficulty-selector" id="diffSelectorEnd">
          <button class="diff-btn" data-diff="easy">入门</button>
          <button class="diff-btn" data-diff="medium">中等</button>
          <button class="diff-btn" data-diff="hard">困难</button>
        </div>
        <button class="btn btn-retry" id="btnRetry">再来一局</button>
      </div>
    </div>

    <div class="info">
      点击移动小球命中得分 — 小球消失后会自动补充新目标<br>
      30秒倒计时结束统计你的总命中数
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const diffLabel = document.getElementById('diffLabel');
const overlayStart = document.getElementById('overlayStart');
const overlayEnd = document.getElementById('overlayEnd');
const finalScoreEl = document.getElementById('finalScore');
const gradeLabel = document.getElementById('gradeLabel');
const endDiffLabel = document.getElementById('endDiffLabel');
const diffBtns = document.querySelectorAll('.diff-btn');

const GAME_DURATION = 30;
const BALL_COUNT = 5;
const BALL_RADIUS = 22;
const TRAIL_LENGTH = 8;

const DIFFICULTY = {
  easy:   { label: '入门', minSpeed: 1, color: '#4ade80' },
  medium: { label: '中等', minSpeed: 2, color: '#fbbf24' },
  hard:   { label: '困难', minSpeed: 3, color: '#f87171' }
};

let currentDiff = 'easy';
let currentSpeed = DIFFICULTY.easy.minSpeed;
let balls = [];
let score = 0;
let timeLeft = GAME_DURATION;
let gameRunning = false;
let animationId = null;
let gameStartTime = 0;

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function createBall(excludeBalls = []) {
  const r = BALL_RADIUS;
  const margin = r + 2;
  let x, y, overlapping;
  let attempts = 0;

  do {
    x = rand(margin, canvas.width - margin);
    y = rand(margin, canvas.height - margin);
    overlapping = false;
    for (const b of excludeBalls) {
      const dx = x - b.x;
      const dy = y - b.y;
      if (Math.sqrt(dx * dx + dy * dy) < r * 3) {
        overlapping = true;
        break;
      }
    }
    attempts++;
  } while (overlapping && attempts < 50);

  const angle = rand(0, Math.PI * 2);
  return {
    x, y,
    vx: Math.cos(angle) * currentSpeed,
    vy: Math.sin(angle) * currentSpeed,
    radius: r,
    trail: [],
    hue: Math.floor(rand(180, 280))
  };
}

function spawnBall() {
  balls.push(createBall(balls));
}

function initBalls() {
  balls = [];
  for (let i = 0; i < BALL_COUNT; i++) {
    spawnBall();
  }
}

function updateTrails() {
  for (const ball of balls) {
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > TRAIL_LENGTH) {
      ball.trail.shift();
    }
  }
}

function moveBalls() {
  for (const ball of balls) {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // bounce off walls
    if (ball.x - ball.radius < 0) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + ball.radius > canvas.width) {
      ball.x = canvas.width - ball.radius;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - ball.radius < 0) {
      ball.y = ball.radius;
      ball.vy = Math.abs(ball.vy);
    } else if (ball.y + ball.radius > canvas.height) {
      ball.y = canvas.height - ball.radius;
      ball.vy = -Math.abs(ball.vy);
    }
  }
}

function drawBall(ball) {
  // trail
  for (let i = 0; i < ball.trail.length; i++) {
    const t = ball.trail[i];
    const alpha = (i / ball.trail.length) * 0.25;
    const r = ball.radius * (0.4 + 0.6 * (i / ball.trail.length));
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${ball.hue}, 70%, 55%, ${alpha})`;
    ctx.fill();
  }

  // main body
  const gradient = ctx.createRadialGradient(
    ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.1,
    ball.x, ball.y, ball.radius
  );
  gradient.addColorStop(0, `hsl(${ball.hue}, 80%, 70%)`);
  gradient.addColorStop(1, `hsl(${ball.hue}, 60%, 35%)`);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = gradient;
  ctx.fill();

  // highlight
  ctx.beginPath();
  ctx.arc(ball.x - ball.radius * 0.25, ball.y - ball.radius * 0.25, ball.radius * 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // subtle grid background
  ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
  ctx.lineWidth = 0.5;
  const gridSize = 40;
  for (let x = gridSize; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = gridSize; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  for (const ball of balls) {
    drawBall(ball);
  }
}

function gameLoop(timestamp) {
  if (!gameRunning) return;

  const elapsed = (timestamp - gameStartTime) / 1000;
  timeLeft = Math.max(0, GAME_DURATION - elapsed);
  timerEl.textContent = Math.ceil(timeLeft);

  if (timeLeft <= 5) {
    timerEl.classList.add('timer-warning');
  }

  if (timeLeft <= 0) {
    endGame();
    return;
  }

  updateTrails();
  moveBalls();
  draw();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  score = 0;
  timeLeft = GAME_DURATION;
  gameRunning = true;
  const d = DIFFICULTY[currentDiff];
  currentSpeed = d.minSpeed;
  diffLabel.textContent = d.label;
  scoreEl.textContent = '0';
  timerEl.textContent = GAME_DURATION;
  timerEl.classList.remove('timer-warning');
  overlayStart.classList.add('hidden');
  overlayEnd.classList.add('hidden');

  initBalls();
  draw();
  gameStartTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning = false;
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  const d = DIFFICULTY[currentDiff];
  endDiffLabel.textContent = '难度: ' + d.label;
  finalScoreEl.textContent = score;

  // grade thresholds adjust by difficulty
  let s, a, b;
  if (currentDiff === 'easy')       { s = 55; a = 44; b = 33; }
  else if (currentDiff === 'medium') { s = 45; a = 36; b = 27; }
  else                               { s = 35; a = 28; b = 21; }

  let grade, badgeClass;
  if (score >= s)        { grade = 'S 级 — 神枪手'; badgeClass = 'badge-s'; }
  else if (score >= a)   { grade = 'A 级 — 精准射手'; badgeClass = 'badge-a'; }
  else if (score >= b)   { grade = 'B 级 — 合格'; badgeClass = 'badge-b'; }
  else                   { grade = 'C 级 — 继续努力'; badgeClass = 'badge-c'; }

  gradeLabel.innerHTML = `<span class="result-badge ${badgeClass}">${grade}</span>`;
  overlayEnd.classList.remove('hidden');
}

function setDifficulty(diff) {
  currentDiff = diff;
  diffBtns.forEach(b => {
    b.classList.toggle('active', b.dataset.diff === diff);
  });
}

diffBtns.forEach(btn => {
  btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
});

canvas.addEventListener('click', (e) => {
  if (!gameRunning) return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    const dx = mx - ball.x;
    const dy = my - ball.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= ball.radius) {
      // hit! remove this ball and spawn a new one
      balls.splice(i, 1);
      score++;
      scoreEl.textContent = score;
      spawnBall();
      return;
    }
  }
});

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRetry').addEventListener('click', startGame);

// initial render
initBalls();
draw();
</script>

</body>
